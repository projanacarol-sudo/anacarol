<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apresentação do CRM — Ana Carolina</title>
<style>
  :root{--brand:#128C7E;--brand-d:#0d6b60;--ink:#14202a;--muted:#66757e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1c22;color:#eaf3f0;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 60px}
  .top{text-align:center;margin-bottom:28px}
  .top .tag{display:inline-block;background:#1b2b33;color:#3fd9bd;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:6px 14px;border-radius:20px}
  h1{font-size:clamp(24px,4vw,34px);margin:14px 0 8px;color:#fff}
  .sub{color:#9fb0b8;font-size:16px;max-width:560px;margin:0 auto;line-height:1.5}
  .player{width:100%;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px #0006}
  .player iframe{display:block;width:100%;aspect-ratio:16/9;border:0;margin:0 auto}
  .cta{text-align:center;margin-top:28px}
  .cta a{display:inline-flex;align-items:center;gap:10px;background:var(--brand);color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:16px 32px;border-radius:14px;box-shadow:0 8px 24px #128c7e55;transition:.15s}
  .cta a:hover{background:var(--brand-d)}
  .foot{text-align:center;color:#6b7c84;font-size:13px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="tag">CRM · Ana Carolina</span>
    <h1>Como usar o seu CRM</h1>
    <p class="sub">Um tour rápido pela central: leads, funis de e-mail, páginas de captura, grupos de WhatsApp e as métricas de audiência.</p>
  </div>

  <div class="player">
    <iframe src="https://player.scaleup.com.br/embed/dffa571ecd4f3c4c277c0940054525cd6c21de02"
      title="Apresentação CRM Ana Carolina"
      allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>
  </div>

  <div class="cta">
    <a href="/painel.html">Acessar o sistema →</a>
  </div>

  <div class="foot">Acesso restrito à equipe · use o e-mail e senha cadastrados.</div>
</div>
</body>
</html>
