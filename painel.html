<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM — Ana Carolina</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{--brand:#128C7E;--brand-d:#0d6b60;--ink:#14202a;--muted:#66757e;--line:#e5e9ec;--bg:#f4f7f8}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .hidden{display:none!important}

  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;max-width:360px;width:100%}
  #login h1{font-size:20px;margin:0 0 4px}
  #login p{color:var(--muted);font-size:13px;margin:0 0 18px}
  #login label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  #login input{width:100%;padding:11px;border:1px solid #cfd8dd;border-radius:9px;font-size:15px}
  #login button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:700;font-size:15px}
  #login .err{color:#c0392b;font-size:13px;margin-top:12px;min-height:16px}

  /* App shell */
  header.top{background:#0f1c22;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px}
  header.top .logo{font-weight:800;letter-spacing:.3px}
  header.top .logo span{color:#3fd9bd}
  header.top .sp{flex:1}
  header.top .who{font-size:12.5px;color:#9fb0b8}
  header.top button{background:transparent;border:1px solid #35505a;color:#cfe1dc;border-radius:8px;padding:6px 12px;font-size:12.5px}
  nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  nav.tabs button{border:0;background:transparent;padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
  nav.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
  main{padding:20px;max-width:1200px;margin:0 auto}
  .panel{display:none}
  .panel.active{display:block}

  /* Cards / grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:6px}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.row2{grid-template-columns:1fr}}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .box h3{margin:0 0 12px;font-size:14px}
  canvas{max-height:300px}

  /* Toolbar + table */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .toolbar input,.toolbar select{padding:9px 10px;border:1px solid #cfd8dd;border-radius:9px;font-size:13.5px}
  .toolbar input[type=search]{min-width:220px;flex:1}
  .btn{padding:9px 14px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:600;font-size:13.5px}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th{background:#0f1c22;color:#fff;text-align:left;padding:10px;font-size:12px;font-weight:600}
  td{padding:10px;border-top:1px solid var(--line);font-size:13px}
  tr:hover td{background:#f8fafb}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.frio{background:#e8eef2;color:#516470}
  .pill.morno{background:#fff1d6;color:#9a6a00}
  .pill.quente{background:#ffe0dd;color:#c0392b}
  .pill.ok{background:#e2f5ee;color:#0f8a63}
  .pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted)}
  .lnk{color:var(--brand);font-weight:700;cursor:pointer;background:none;border:0;font-size:13px}
  .muted{color:var(--muted)}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,28,34,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 14px}
  .modal label{display:block;font-size:12.5px;font-weight:600;margin:11px 0 5px;color:#41505a}
  .modal input,.modal select{width:100%;padding:10px;border:1px solid #cfd8dd;border-radius:9px;font-size:14px}
  .modal .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-weight:600}
  .modal .chk input{width:auto}
  .modal .actions{display:flex;gap:8px;margin-top:20px}
  .modal .actions .btn{flex:1;justify-content:center}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f1c22;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- ============================ CONFIG ============================ -->
<script>
  // O painel busca a config em /api/config (variáveis do Pages) ao abrir.
  // Estes valores são só um fallback caso você prefira fixar aqui no arquivo.
  // A anon key é pública por design; quem protege os dados é o RLS + login.
  let SUPABASE_URL = "https://ftwzcgmtczzjkuqudith.supabase.co";
  let SUPABASE_ANON_KEY = "SUA_ANON_KEY_AQUI";
</script>

<!-- ============================ LOGIN ============================ -->
<div id="login">
  <form class="card" id="loginForm">
    <h1>CRM <span style="color:var(--brand)">Ana Carolina</span></h1>
    <p>Acesso restrito à equipe.</p>
    <label>E-mail</label>
    <input type="email" id="loginEmail" autocomplete="username" required>
    <label>Senha</label>
    <input type="password" id="loginPass" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- ============================ APP ============================ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="logo">CRM <span>Ana Carolina</span></div>
    <div class="sp"></div>
    <div class="who" id="whoami"></div>
    <button id="btnLogout">Sair</button>
  </header>

  <nav class="tabs">
    <button data-tab="overview" class="active">Visão geral</button>
    <button data-tab="leads">Leads</button>
    <button data-tab="email">E-mail / Funil</button>
    <button data-tab="canais">Grupos e Redes</button>
  </nav>

  <main>
    <!-- ------- VISÃO GERAL ------- -->
    <section class="panel active" id="panel-overview">
      <div class="cards" id="kpis"></div>
      <div class="row2">
        <div class="box"><h3>Crescimento da base (por mês)</h3><canvas id="chartMes"></canvas></div>
        <div class="box"><h3>Aquecimento dos leads</h3><canvas id="chartFunil"></canvas></div>
      </div>
      <div class="box"><h3>Leads por estado (top 12)</h3><canvas id="chartUf"></canvas></div>
    </section>

    <!-- ------- LEADS ------- -->
    <section class="panel" id="panel-leads">
      <div class="toolbar">
        <input type="search" id="fSearch" placeholder="Buscar por nome ou e-mail...">
        <select id="fUf"><option value="">Todos os estados</option></select>
        <select id="fOrigem"><option value="">Todas as origens</option></select>
        <select id="fStatus">
          <option value="">Todos os status</option>
          <option value="frio">Frio</option><option value="morno">Morno</option><option value="quente">Quente</option>
        </select>
        <select id="fOptin">
          <option value="">Opt-in: todos</option>
          <option value="true">Com opt-in</option><option value="false">Sem opt-in</option>
        </select>
        <button class="btn" id="btnFiltrar">Filtrar</button>
        <button class="btn ghost" id="btnExport">Exportar CSV</button>
      </div>
      <div id="leadsWrap"></div>
      <div class="pager">
        <span id="pagInfo"></span>
        <button class="btn ghost" id="pgPrev">‹ Anterior</button>
        <button class="btn ghost" id="pgNext">Próxima ›</button>
      </div>
    </section>

    <!-- ------- E-MAIL / FUNIL ------- -->
    <section class="panel" id="panel-email">
      <div class="cards" id="emailKpis"></div>
      <div class="row2">
        <div class="box"><h3>Eventos de e-mail</h3><canvas id="chartEmail"></canvas></div>
        <div class="box"><h3>Sequências</h3><div id="seqList"></div></div>
      </div>
    </section>

    <!-- ------- GRUPOS E REDES ------- -->
    <section class="panel" id="panel-canais">
      <div class="box"><h3>Grupos de WhatsApp (SendFlow)</h3><div id="gruposWrap"></div></div>
      <div class="box"><h3>Redes sociais</h3><div id="socialWrap"></div></div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<!-- ============================ APP JS ============================ -->
<script>
let sb;   // criado após carregar a config (/api/config ou fallback do arquivo)
let CHARTS = {};
let ORIGENS = {};        // id -> nome
let SEQUENCES = [];      // {id, nome}
const PAGE_SIZE = 25;
let page = 0, lastCount = 0;

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function fmt(n){return (n==null?0:n).toLocaleString("pt-BR");}

/* ---------- checagem de configuração ---------- */
function configOk(){
  return SUPABASE_URL && SUPABASE_ANON_KEY
    && !/SEU-PROJETO/.test(SUPABASE_URL)
    && !/SUA_ANON_KEY/.test(SUPABASE_ANON_KEY)
    && /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL);
}

/* ---------- auth ---------- */
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#loginErr").textContent = "";

  // 1) config não preenchida é a causa nº 1 de "senha inválida"
  if (!configOk()){
    $("#loginErr").textContent = "⚠️ Configuração ausente: preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do painel.html.";
    console.error("[login] SUPABASE_URL/ANON_KEY não preenchidos ou inválidos.");
    return;
  }

  $("#loginBtn").disabled = true; $("#loginBtn").textContent = "Entrando...";
  const { error } = await sb.auth.signInWithPassword({
    email: $("#loginEmail").value.trim(), password: $("#loginPass").value
  });
  $("#loginBtn").disabled = false; $("#loginBtn").textContent = "Entrar";

  if (error) {
    // Mostra o motivo REAL (antes escondíamos tudo como "senha inválida")
    console.error("[login] erro:", error);
    var m = error.message || "";
    var amigavel = m;
    if (/invalid login credentials/i.test(m)) amigavel = "E-mail ou senha incorretos.";
    else if (/email not confirmed/i.test(m)) amigavel = "Usuário não confirmado. Recrie com 'Auto Confirm User' marcado.";
    else if (/failed to fetch|networkerror/i.test(m)) amigavel = "Não conectou ao Supabase. Confira a URL/anon key.";
    $("#loginErr").textContent = "Erro: " + amigavel;
    return;
  }
  boot();
});
$("#btnLogout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

async function guard(){
  const { data } = await sb.auth.getSession();
  if (data.session) boot();
}
async function boot(){
  const { data } = await sb.auth.getUser();
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#whoami").textContent = data.user ? data.user.email : "";
  await loadRefs();
  loadOverview();
}

/* ---------- tabs ---------- */
$$("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  $$("nav.tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  $$(".panel").forEach(p=>p.classList.remove("active"));
  $("#panel-"+b.dataset.tab).classList.add("active");
  if (b.dataset.tab==="leads") loadLeads();
  if (b.dataset.tab==="email") loadEmail();
  if (b.dataset.tab==="canais") loadCanais();
}));

/* ---------- referências (origens, sequências, UFs) ---------- */
async function loadRefs(){
  const { data: origens } = await sb.from("origens").select("id,nome").order("nome");
  (origens||[]).forEach(o => ORIGENS[o.id]=o.nome);
  const selO = $("#fOrigem");
  (origens||[]).forEach(o => selO.insertAdjacentHTML("beforeend", `<option value="${o.id}">${esc(o.nome)}</option>`));

  const { data: seqs } = await sb.from("email_sequences").select("id,nome,ativo").order("nome");
  SEQUENCES = seqs || [];

  const { data: ufs } = await sb.rpc("crm_por_uf");
  const selU = $("#fUf");
  (ufs||[]).filter(u=>u.uf!=="—").forEach(u => selU.insertAdjacentHTML("beforeend", `<option value="${u.uf}">${u.uf} (${fmt(u.total)})</option>`));
}

/* ================= VISÃO GERAL ================= */
async function loadOverview(){
  const { data: ov } = await sb.rpc("crm_overview");
  const o = ov || {};
  $("#kpis").innerHTML = [
    kpi("Total de leads", fmt(o.total)),
    kpi("Com opt-in de e-mail", fmt(o.com_optin), pct(o.com_optin,o.total)),
    kpi("Com WhatsApp", fmt(o.com_telefone), pct(o.com_telefone,o.total)),
    kpi("Estado identificado", fmt(o.com_uf), pct(o.com_uf,o.total)),
    kpi("Novos (30 dias)", fmt(o.novos_30d)),
  ].join("");

  const { data: mes } = await sb.rpc("crm_por_mes");
  lineChart("chartMes", (mes||[]).map(r=>r.mes), (mes||[]).map(r=>Number(r.total)), "Novos leads");

  doughnut("chartFunil", ["Frio","Morno","Quente"],
    [Number(o.frio||0),Number(o.morno||0),Number(o.quente||0)],
    ["#8aa0ab","#f5b301","#e0574c"]);

  const { data: uf } = await sb.rpc("crm_por_uf");
  const top = (uf||[]).filter(u=>u.uf!=="—").slice(0,12);
  barChart("chartUf", top.map(r=>r.uf), top.map(r=>Number(r.total)), "Leads");
}
function kpi(l,v,sub){return `<div class="kpi"><div class="lbl">${esc(l)}</div><div class="val">${v}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`;}
function pct(a,b){if(!b)return"";return Math.round((Number(a||0)/Number(b))*100)+"% da base";}

/* ================= LEADS ================= */
function leadFilters(){
  let q = sb.from("leads").select("id,nome,email,telefone_e164,uf,origem_id,status_aquecimento,opt_in_email,tags,created_at",{count:"exact"});
  const s = $("#fSearch").value.trim();
  if (s) q = q.or(`nome.ilike.%${s}%,email.ilike.%${s}%`);
  if ($("#fUf").value) q = q.eq("uf", $("#fUf").value);
  if ($("#fOrigem").value) q = q.eq("origem_id", $("#fOrigem").value);
  if ($("#fStatus").value) q = q.eq("status_aquecimento", $("#fStatus").value);
  if ($("#fOptin").value) q = q.eq("opt_in_email", $("#fOptin").value==="true");
  return q;
}
async function loadLeads(){
  const from = page*PAGE_SIZE, to = from+PAGE_SIZE-1;
  const { data, count, error } = await leadFilters().order("created_at",{ascending:false}).range(from,to);
  if (error){ toast("Erro ao carregar leads"); return; }
  lastCount = count||0;
  renderLeads(data||[]);
  $("#pagInfo").textContent = lastCount ? `${from+1}–${Math.min(to+1,lastCount)} de ${fmt(lastCount)}` : "Nenhum lead";
  $("#pgPrev").disabled = page===0;
  $("#pgNext").disabled = to+1>=lastCount;
}
function renderLeads(rows){
  if (!rows.length){ $("#leadsWrap").innerHTML = `<div class="empty">Nenhum lead encontrado com esses filtros.</div>`; return; }
  const body = rows.map(r=>`<tr>
    <td>${esc(r.nome)||"<span class='muted'>—</span>"}</td>
    <td>${esc(r.email)||"<span class='muted'>—</span>"}</td>
    <td>${esc(r.telefone_e164)||"<span class='muted'>—</span>"}</td>
    <td>${r.uf?esc(r.uf):"<span class='muted'>—</span>"}</td>
    <td>${esc(ORIGENS[r.origem_id]||"")}</td>
    <td><span class="pill ${esc(r.status_aquecimento)}">${esc(r.status_aquecimento)}</span></td>
    <td>${r.opt_in_email?'<span class="pill ok">opt-in</span>':'<span class="muted">—</span>'}</td>
    <td><button class="lnk" data-edit="${r.id}">Editar</button></td>
  </tr>`).join("");
  $("#leadsWrap").innerHTML = `<table><thead><tr>
    <th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>UF</th><th>Origem</th><th>Status</th><th>Opt-in</th><th></th>
  </tr></thead><tbody>${body}</tbody></table>`;
  $$("[data-edit]").forEach(b=>b.addEventListener("click",()=>openLead(rows.find(x=>x.id===b.dataset.edit))));
}
$("#btnFiltrar").addEventListener("click",()=>{page=0;loadLeads();});
$("#fSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){page=0;loadLeads();}});
$("#pgPrev").addEventListener("click",()=>{if(page>0){page--;loadLeads();}});
$("#pgNext").addEventListener("click",()=>{page++;loadLeads();});

/* ------- modal de edição + ações ------- */
function openLead(l){
  if(!l) return;
  const seqOpts = SEQUENCES.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join("");
  $("#modalRoot").innerHTML = `
  <div class="overlay" id="ov">
    <div class="modal">
      <h3>Editar lead</h3>
      <label>Nome</label><input id="mNome" value="${esc(l.nome)}">
      <label>E-mail</label><input id="mEmail" value="${esc(l.email)}">
      <label>WhatsApp (E.164)</label><input id="mTel" value="${esc(l.telefone_e164)}">
      <label>Status de aquecimento</label>
      <select id="mStatus">
        <option value="frio"${l.status_aquecimento==="frio"?" selected":""}>Frio</option>
        <option value="morno"${l.status_aquecimento==="morno"?" selected":""}>Morno</option>
        <option value="quente"${l.status_aquecimento==="quente"?" selected":""}>Quente</option>
      </select>
      <label>Tags (separadas por vírgula)</label><input id="mTags" value="${esc((l.tags||[]).join(', '))}">
      <div class="chk"><input type="checkbox" id="mOptin" ${l.opt_in_email?"checked":""}><label style="margin:0">Opt-in de e-mail</label></div>
      <div class="actions">
        <button class="btn" id="mSave">Salvar</button>
        <button class="btn ghost" id="mClose">Cancelar</button>
      </div>
      <div class="divider"></div>
      <label>Adicionar a uma sequência de e-mail</label>
      <select id="mSeq">${seqOpts||'<option value="">Nenhuma sequência criada</option>'}</select>
      <button class="btn ghost" id="mAddSeq" style="margin-top:10px;width:100%">Adicionar ao funil</button>
    </div>
  </div>`;
  const close=()=>{$("#modalRoot").innerHTML="";};
  $("#mClose").addEventListener("click",close);
  $("#ov").addEventListener("click",e=>{if(e.target.id==="ov")close();});
  $("#mSave").addEventListener("click",async()=>{
    const tags = $("#mTags").value.split(",").map(t=>t.trim()).filter(Boolean);
    const { error } = await sb.from("leads").update({
      nome:$("#mNome").value.trim()||null,
      email:$("#mEmail").value.trim()||null,
      email_normalizado:($("#mEmail").value.trim().toLowerCase()||null),
      telefone_e164:$("#mTel").value.trim()||null,
      status_aquecimento:$("#mStatus").value,
      tags, opt_in_email:$("#mOptin").checked
    }).eq("id",l.id);
    if(error){toast("Erro ao salvar");return;}
    toast("Lead atualizado");close();loadLeads();
  });
  $("#mAddSeq").addEventListener("click",async()=>{
    const seqId=$("#mSeq").value; if(!seqId){toast("Crie uma sequência primeiro");return;}
    const { error } = await sb.from("lead_sequence_state").upsert({
      lead_id:l.id, sequence_id:seqId, step_atual:0,
      proximo_envio_em:new Date().toISOString(), status:"ativo"
    },{onConflict:"lead_id,sequence_id"});
    if(error){toast("Erro ao adicionar ao funil");return;}
    toast("Adicionado à sequência");
  });
}

/* ------- exportar CSV ------- */
$("#btnExport").addEventListener("click", async ()=>{
  toast("Preparando CSV...");
  const { data, error } = await leadFilters().order("created_at",{ascending:false}).range(0, 49999);
  if(error){toast("Erro ao exportar");return;}
  const cols=["nome","email","telefone_e164","uf","status_aquecimento","opt_in_email"];
  const head=cols.join(";");
  const lines=(data||[]).map(r=>cols.map(c=>csv(r[c])).join(";"));
  const blob=new Blob(["﻿"+head+"\n"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="leads-ana-"+new Date().toISOString().slice(0,10)+".csv";a.click();
  toast(`Exportados ${fmt((data||[]).length)} leads`);
});
function csv(v){if(v==null)return"";const s=String(v).replace(/"/g,'""');return /[;"\n]/.test(s)?`"${s}"`:s;}

/* ================= E-MAIL / FUNIL ================= */
async function loadEmail(){
  const { data: ev } = await sb.rpc("crm_email_eventos");
  const map={}; (ev||[]).forEach(e=>map[e.tipo]=Number(e.total));
  $("#emailKpis").innerHTML=[
    kpi("Enviados",fmt(map.sent||map.delivered||0)),
    kpi("Aberturas",fmt(map.opened||0)),
    kpi("Cliques",fmt(map.clicked||0)),
    kpi("Descadastros",fmt(map.unsubscribed||0)),
  ].join("");
  const order=["sent","delivered","opened","clicked","bounced","complained","unsubscribed"];
  const labels=order.filter(t=>map[t]!=null);
  barChart("chartEmail", labels, labels.map(t=>map[t]), "Eventos");
  if(!labels.length) $("#chartEmail").parentElement.innerHTML='<h3>Eventos de e-mail</h3><div class="empty">Sem eventos ainda. Aparecem quando o funil começar a enviar.</div>';

  if(!SEQUENCES.length){ $("#seqList").innerHTML='<div class="empty">Nenhuma sequência criada ainda.</div>'; return; }
  const rows=[];
  for(const s of SEQUENCES){
    const { count } = await sb.from("lead_sequence_state").select("*",{count:"exact",head:true}).eq("sequence_id",s.id).eq("status","ativo");
    rows.push(`<tr><td>${esc(s.nome)}</td><td>${s.ativo?'<span class="pill ok">ativa</span>':'<span class="muted">pausada</span>'}</td><td>${fmt(count||0)} leads ativos</td></tr>`);
  }
  $("#seqList").innerHTML=`<table><thead><tr><th>Sequência</th><th>Status</th><th>No funil</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
}

/* ================= GRUPOS E REDES ================= */
async function loadCanais(){
  const { data: g } = await sb.from("groups").select("nome,qtd_membros,ativo").order("qtd_membros",{ascending:false});
  if(g && g.length){
    $("#gruposWrap").innerHTML=`<table><thead><tr><th>Grupo</th><th>Membros</th><th>Status</th></tr></thead><tbody>${
      g.map(x=>`<tr><td>${esc(x.nome)}</td><td>${fmt(x.qtd_membros)}</td><td>${x.ativo?'<span class="pill ok">ativo</span>':'<span class="muted">inativo</span>'}</td></tr>`).join("")
    }</tbody></table>`;
  } else $("#gruposWrap").innerHTML='<div class="empty">Nenhum grupo ainda. Aparecem quando o webhook do SendFlow for ligado.</div>';

  const { data: s } = await sb.from("social_accounts").select("id,plataforma,handle").eq("ativo",true);
  if(!s || !s.length){ $("#socialWrap").innerHTML='<div class="empty">Nenhuma conta social conectada ainda.</div>'; return; }
  const cards=[];
  for(const acc of s){
    const { data: m } = await sb.from("social_metrics").select("seguidores,visualizacoes,coletado_em").eq("account_id",acc.id).order("coletado_em",{ascending:false}).limit(1);
    const last=m&&m[0]?m[0]:{};
    cards.push(kpi(`${acc.plataforma} ${acc.handle?"· "+acc.handle:""}`, fmt(last.seguidores||0), last.coletado_em?("atualizado "+new Date(last.coletado_em).toLocaleDateString("pt-BR")):"sem coleta"));
  }
  $("#socialWrap").innerHTML=`<div class="cards">${cards.join("")}</div>`;
}

/* ================= CHART HELPERS ================= */
function destroy(id){ if(CHARTS[id]){CHARTS[id].destroy();delete CHARTS[id];} }
function lineChart(id,labels,data,label){
  destroy(id);
  CHARTS[id]=new Chart($("#"+id),{type:"line",data:{labels,datasets:[{label,data,borderColor:"#128C7E",backgroundColor:"#128C7E22",fill:true,tension:.3,pointRadius:2}]},options:baseOpts()});
}
function barChart(id,labels,data,label){
  destroy(id);
  CHARTS[id]=new Chart($("#"+id),{type:"bar",data:{labels,datasets:[{label,data,backgroundColor:"#128C7E"}]},options:baseOpts()});
}
function doughnut(id,labels,data,colors){
  destroy(id);
  CHARTS[id]=new Chart($("#"+id),{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:"bottom"}}}});
}
function baseOpts(){return{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}};}

/* ---------- start ---------- */
async function init(){
  // Tenta a config do Pages (variáveis) primeiro; cai no fallback do arquivo.
  try{
    const r = await fetch("/api/config", { cache: "no-store" });
    const c = await r.json();
    if (c && c.ok && c.url && c.anonKey){ SUPABASE_URL = c.url; SUPABASE_ANON_KEY = c.anonKey; }
  }catch(e){ console.warn("[config] /api/config indisponível, usando fallback do arquivo.", e); }

  if (!configOk()){
    $("#loginErr").textContent = "⚠️ Configuração ausente: adicione a variável SUPABASE_ANON_KEY nas variáveis do Pages (ou preencha no topo do painel.html).";
    console.error("[config] SUPABASE_ANON_KEY não encontrada.");
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  guard();
}
init();
</script>
