<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM — Ana Carolina</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{--brand:#128C7E;--brand-d:#0d6b60;--ink:#14202a;--muted:#66757e;--line:#e5e9ec;--bg:#f4f7f8}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .hidden{display:none!important}

  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;max-width:360px;width:100%}
  #login h1{font-size:20px;margin:0 0 4px}
  #login p{color:var(--muted);font-size:13px;margin:0 0 18px}
  #login label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  #login input{width:100%;padding:11px;border:1px solid #cfd8dd;border-radius:9px;font-size:15px}
  #login button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:700;font-size:15px}
  #login .err{color:#c0392b;font-size:13px;margin-top:12px;min-height:16px}

  /* App shell */
  header.top{background:#0f1c22;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px}
  header.top .logo{font-weight:800;letter-spacing:.3px}
  header.top .logo span{color:#3fd9bd}
  header.top .sp{flex:1}
  header.top .who{font-size:12.5px;color:#9fb0b8}
  header.top button{background:transparent;border:1px solid #35505a;color:#cfe1dc;border-radius:8px;padding:6px 12px;font-size:12.5px}
  nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  nav.tabs button{border:0;background:transparent;padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
  nav.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
  main{padding:20px;max-width:1200px;margin:0 auto}
  .panel{display:none}
  .panel.active{display:block}

  /* Cards / grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:6px}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.row2{grid-template-columns:1fr}}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .box h3{margin:0 0 12px;font-size:14px}
  canvas{max-height:300px}

  /* Toolbar + table */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .toolbar input,.toolbar select{padding:9px 10px;border:1px solid #cfd8dd;border-radius:9px;font-size:13.5px}
  .toolbar input[type=search]{min-width:220px;flex:1}
  .btn{padding:9px 14px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:600;font-size:13.5px}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th{background:#0f1c22;color:#fff;text-align:left;padding:10px;font-size:12px;font-weight:600}
  td{padding:10px;border-top:1px solid var(--line);font-size:13px}
  tr:hover td{background:#f8fafb}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.frio{background:#e8eef2;color:#516470}
  .pill.morno{background:#fff1d6;color:#9a6a00}
  .pill.quente{background:#ffe0dd;color:#c0392b}
  .pill.ok{background:#e2f5ee;color:#0f8a63}
  .pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted)}
  .lnk{color:var(--brand);font-weight:700;cursor:pointer;background:none;border:0;font-size:13px}
  .muted{color:var(--muted)}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,28,34,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 14px}
  .modal label{display:block;font-size:12.5px;font-weight:600;margin:11px 0 5px;color:#41505a}
  .modal input,.modal select{width:100%;padding:10px;border:1px solid #cfd8dd;border-radius:9px;font-size:14px}
  .modal .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-weight:600}
  .modal .chk input{width:auto}
  .modal .actions{display:flex;gap:8px;margin-top:20px}
  .modal .actions .btn{flex:1;justify-content:center}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f1c22;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  /* visão geral estilo monitor (cores do painel) */
  .placar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .placar .kpi .val{color:var(--brand)}
  .ovbars .ovrow{margin-bottom:13px}.ovbars .ovrow:last-child{margin-bottom:0}
  .ovh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .ovn{font-weight:800;font-size:14.5px}.ovv{font-weight:900;font-size:16px}
  .ovtag{font-size:11px;color:#0f8a63;background:#e2f5ee;padding:2px 8px;border-radius:10px;margin-left:7px}
  .ovtrack{height:18px;background:#eef2f4;border-radius:9px;overflow:hidden}
  .ovfill{height:100%;border-radius:9px;width:0;background:var(--brand);transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .ovrow.top .ovfill{background:#f5b301}
  .resumo h3{margin:0 0 10px}
  .resumo .rz{display:flex;gap:8px;font-size:14px;margin:8px 0;color:#2a3540}
  .resumo .rz b{color:#0f1c22;font-weight:800}
</style>
</head>
<body>

<!-- ============================ CONFIG ============================ -->
<script>
  // O painel busca a config em /api/config (variáveis do Pages) ao abrir.
  // Estes valores são só um fallback caso você prefira fixar aqui no arquivo.
  // A anon key é pública por design; quem protege os dados é o RLS + login.
  let SUPABASE_URL = "https://ftwzcgmtczzjkuqudith.supabase.co";
  let SUPABASE_ANON_KEY = "SUA_ANON_KEY_AQUI";
</script>

<!-- ============================ LOGIN ============================ -->
<div id="login">
  <form class="card" id="loginForm">
    <h1>CRM <span style="color:var(--brand)">Ana Carolina</span></h1>
    <p>Acesso restrito à equipe.</p>
    <label>E-mail</label>
    <input type="email" id="loginEmail" autocomplete="username" required>
    <label>Senha</label>
    <input type="password" id="loginPass" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- ============================ APP ============================ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="logo">CRM <span>Ana Carolina</span></div>
    <div class="sp"></div>
    <div class="who" id="whoami"></div>
    <button id="btnLogout">Sair</button>
  </header>

  <nav class="tabs">
    <button data-tab="overview" class="active">Visão geral</button>
    <button data-tab="leads">Leads</button>
    <button data-tab="email">E-mail / Funil</button>
    <button data-tab="canais">Grupos e Redes</button>
  </nav>

  <main>
    <!-- ------- VISÃO GERAL ------- -->
    <section class="panel active" id="panel-overview">
      <div class="placar" id="kpis"></div>
      <div class="box"><h3>📍 Leads por estado</h3><div id="ufBars" class="ovbars"></div></div>
      <div class="row2">
        <div class="box"><h3>📈 Crescimento da base (por mês)</h3><canvas id="chartMes"></canvas></div>
        <div class="box"><h3>🔥 Aquecimento dos leads</h3><canvas id="chartFunil"></canvas></div>
      </div>
      <div class="box resumo" id="resumoOv"></div>
    </section>

    <!-- ------- LEADS ------- -->
    <section class="panel" id="panel-leads">
      <div class="toolbar">
        <input type="search" id="fSearch" placeholder="Buscar por nome ou e-mail...">
        <select id="fUf"><option value="">Todos os estados</option></select>
        <select id="fOrigem"><option value="">Todas as origens</option></select>
        <select id="fStatus">
          <option value="">Todos os status</option>
          <option value="frio">Frio</option><option value="morno">Morno</option><option value="quente">Quente</option>
        </select>
        <select id="fOptin">
          <option value="">Opt-in: todos</option>
          <option value="true">Com opt-in</option><option value="false">Sem opt-in</option>
        </select>
        <button class="btn" id="btnFiltrar">Filtrar</button>
        <button class="btn ghost" id="btnExport">Exportar CSV</button>
      </div>
      <div id="leadsWrap"></div>
      <div class="pager">
        <span id="pagInfo"></span>
        <button class="btn ghost" id="pgPrev">‹ Anterior</button>
        <button class="btn ghost" id="pgNext">Próxima ›</button>
      </div>
    </section>

    <!-- ------- E-MAIL / FUNIL ------- -->
    <section class="panel" id="panel-email">
      <div class="cards" id="emailKpis"></div>
      <div class="toolbar">
        <button class="btn" id="btnNovaSeq">+ Nova sequência</button>
        <button class="btn ghost" id="btnInscrever">Inscrever segmento</button>
      </div>
      <div class="box"><h3>Funis de e-mail</h3><div id="seqList"></div></div>
    </section>

    <!-- ------- GRUPOS E REDES ------- -->
    <section class="panel" id="panel-canais">
      <div class="box"><h3>Grupos de WhatsApp (SendFlow)</h3><div id="gruposWrap"></div></div>
      <div class="box"><h3>Redes sociais</h3><div id="socialWrap"></div></div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<!-- ============================ APP JS ============================ -->
<script>
let sb;   // criado após carregar a config (/api/config ou fallback do arquivo)
let CHARTS = {};
let ORIGENS = {};        // id -> nome
let SEQUENCES = [];      // {id, nome}
const PAGE_SIZE = 25;
let page = 0, lastCount = 0;

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function fmt(n){return (n==null?0:n).toLocaleString("pt-BR");}

/* ---------- checagem de configuração ---------- */
function configOk(){
  return SUPABASE_URL && SUPABASE_ANON_KEY
    && !/SEU-PROJETO/.test(SUPABASE_URL)
    && !/SUA_ANON_KEY/.test(SUPABASE_ANON_KEY)
    && /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL);
}

/* ---------- auth ---------- */
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#loginErr").textContent = "";

  // 1) config não preenchida é a causa nº 1 de "senha inválida"
  if (!configOk()){
    $("#loginErr").textContent = "⚠️ Configuração ausente: preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do painel.html.";
    console.error("[login] SUPABASE_URL/ANON_KEY não preenchidos ou inválidos.");
    return;
  }

  $("#loginBtn").disabled = true; $("#loginBtn").textContent = "Entrando...";
  const { error } = await sb.auth.signInWithPassword({
    email: $("#loginEmail").value.trim(), password: $("#loginPass").value
  });
  $("#loginBtn").disabled = false; $("#loginBtn").textContent = "Entrar";

  if (error) {
    // Mostra o motivo REAL (antes escondíamos tudo como "senha inválida")
    console.error("[login] erro:", error);
    var m = error.message || "";
    var amigavel = m;
    if (/invalid login credentials/i.test(m)) amigavel = "E-mail ou senha incorretos.";
    else if (/email not confirmed/i.test(m)) amigavel = "Usuário não confirmado. Recrie com 'Auto Confirm User' marcado.";
    else if (/failed to fetch|networkerror/i.test(m)) amigavel = "Não conectou ao Supabase. Confira a URL/anon key.";
    $("#loginErr").textContent = "Erro: " + amigavel;
    return;
  }
  boot();
});
$("#btnLogout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

async function guard(){
  const { data } = await sb.auth.getSession();
  if (data.session) boot();
}
async function boot(){
  const { data } = await sb.auth.getUser();
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#whoami").textContent = data.user ? data.user.email : "";
  await loadRefs();
  loadOverview();
}

/* ---------- tabs ---------- */
$$("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  $$("nav.tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  $$(".panel").forEach(p=>p.classList.remove("active"));
  $("#panel-"+b.dataset.tab).classList.add("active");
  if (b.dataset.tab==="leads") loadLeads();
  if (b.dataset.tab==="email") loadEmail();
  if (b.dataset.tab==="canais") loadCanais();
}));

/* ---------- referências (origens, sequências, UFs) ---------- */
async function loadRefs(){
  const { data: origens } = await sb.from("origens").select("id,nome").order("nome");
  (origens||[]).forEach(o => ORIGENS[o.id]=o.nome);
  const selO = $("#fOrigem");
  (origens||[]).forEach(o => selO.insertAdjacentHTML("beforeend", `<option value="${o.id}">${esc(o.nome)}</option>`));

  const { data: seqs } = await sb.from("email_sequences").select("id,nome,ativo").order("nome");
  SEQUENCES = seqs || [];

  const { data: ufs } = await sb.rpc("crm_por_uf");
  const selU = $("#fUf");
  (ufs||[]).filter(u=>u.uf!=="—").forEach(u => selU.insertAdjacentHTML("beforeend", `<option value="${u.uf}">${u.uf} (${fmt(u.total)})</option>`));
}

/* ================= VISÃO GERAL ================= */
async function loadOverview(){
  const { data: ov } = await sb.rpc("crm_overview");
  const o = ov || {};
  $("#kpis").innerHTML = [
    kpi("Total de leads", o.total),
    kpi("Com opt-in de e-mail", o.com_optin, pct(o.com_optin,o.total)),
    kpi("Com WhatsApp", o.com_telefone, pct(o.com_telefone,o.total)),
    kpi("Estado identificado", o.com_uf, pct(o.com_uf,o.total)),
    kpi("Novos (30 dias)", o.novos_30d),
  ].join("");
  animAll();

  const { data: mes } = await sb.rpc("crm_por_mes");
  barChart("chartMes", (mes||[]).map(r=>r.mes), (mes||[]).map(r=>Number(r.total)), "Novos leads");

  doughnut("chartFunil", ["Frio","Morno","Quente"],
    [Number(o.frio||0),Number(o.morno||0),Number(o.quente||0)],
    ["#8aa0ab","#f5b301","#e0574c"]);

  const { data: uf } = await sb.rpc("crm_por_uf");
  const top = (uf||[]).filter(u=>u.uf!=="—");
  estadoBarsOv("ufBars", top.slice(0,10));
  const t0=top[0]||{};
  $("#resumoOv").innerHTML=`<h3>📝 Resumo</h3>
    <div class="rz">✓ Base de <b>${fmt(o.total)}</b> leads, <b>${pct(o.com_optin,o.total)}</b> com opt-in.</div>
    <div class="rz">✓ <b>${fmt(o.com_telefone)}</b> com WhatsApp para disparo 1 a 1.</div>
    <div class="rz">✓ <b>${esc(t0.uf||"—")}</b> lidera com <b>${fmt(t0.total||0)}</b> leads.</div>
    <div class="rz">✓ <b>${fmt(o.novos_30d)}</b> novos leads nos últimos 30 dias.</div>`;
}
function kpi(l,v,sub){return `<div class="kpi"><div class="lbl">${esc(l)}</div><div class="val" data-c="${Number(v||0)}">0</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>`;}
function pct(a,b){if(!b)return"0%";return Math.round((Number(a||0)/Number(b))*100)+"%";}
function animNum(el,tgt,dur){dur=dur||1000;let s=null;const step=ts=>{if(!s)s=ts;const p=Math.min((ts-s)/dur,1);const e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(tgt*e));if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
function animAll(){$$("[data-c]").forEach(el=>animNum(el,Number(el.dataset.c)));}
function estadoBarsOv(boxId,arr){
  const box=$("#"+boxId); if(!arr||!arr.length){box.innerHTML='<div class="empty">Sem dados ainda.</div>';return;}
  const max=Number(arr[0].total)||1;
  box.innerHTML=arr.map((s,i)=>`<div class="ovrow ${i===0?"top":""}">
    <div class="ovh"><span class="ovn">${esc(s.uf)}${i===0?' <span class="ovtag">1º</span>':""}</span><span class="ovv">${fmt(s.total)}</span></div>
    <div class="ovtrack"><div class="ovfill" data-w="${(Number(s.total)/max*100).toFixed(1)}"></div></div>
  </div>`).join("");
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.style.width=e.target.dataset.w+"%";io.unobserve(e.target);}}),{threshold:.1});
  box.querySelectorAll(".ovfill").forEach(f=>io.observe(f));
}

/* ================= LEADS ================= */
function leadFilters(){
  let q = sb.from("leads").select("id,nome,email,telefone_e164,uf,origem_id,status_aquecimento,opt_in_email,tags,created_at",{count:"exact"});
  const s = $("#fSearch").value.trim();
  if (s) q = q.or(`nome.ilike.%${s}%,email.ilike.%${s}%`);
  if ($("#fUf").value) q = q.eq("uf", $("#fUf").value);
  if ($("#fOrigem").value) q = q.eq("origem_id", $("#fOrigem").value);
  if ($("#fStatus").value) q = q.eq("status_aquecimento", $("#fStatus").value);
  if ($("#fOptin").value) q = q.eq("opt_in_email", $("#fOptin").value==="true");
  return q;
}
async function loadLeads(){
  const from = page*PAGE_SIZE, to = from+PAGE_SIZE-1;
  const { data, count, error } = await leadFilters().order("created_at",{ascending:false}).range(from,to);
  if (error){ toast("Erro ao carregar leads"); return; }
  lastCount = count||0;
  renderLeads(data||[]);
  $("#pagInfo").textContent = lastCount ? `${from+1}–${Math.min(to+1,lastCount)} de ${fmt(lastCount)}` : "Nenhum lead";
  $("#pgPrev").disabled = page===0;
  $("#pgNext").disabled = to+1>=lastCount;
}
function renderLeads(rows){
  if (!rows.length){ $("#leadsWrap").innerHTML = `<div class="empty">Nenhum lead encontrado com esses filtros.</div>`; return; }
  const body = rows.map(r=>`<tr>
    <td>${esc(r.nome)||"<span class='muted'>—</span>"}</td>
    <td>${esc(r.email)||"<span class='muted'>—</span>"}</td>
    <td>${esc(r.telefone_e164)||"<span class='muted'>—</span>"}</td>
    <td>${r.uf?esc(r.uf):"<span class='muted'>—</span>"}</td>
    <td>${esc(ORIGENS[r.origem_id]||"")}</td>
    <td><span class="pill ${esc(r.status_aquecimento)}">${esc(r.status_aquecimento)}</span></td>
    <td>${r.opt_in_email?'<span class="pill ok">opt-in</span>':'<span class="muted">—</span>'}</td>
    <td><button class="lnk" data-edit="${r.id}">Editar</button></td>
  </tr>`).join("");
  $("#leadsWrap").innerHTML = `<table><thead><tr>
    <th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>UF</th><th>Origem</th><th>Status</th><th>Opt-in</th><th></th>
  </tr></thead><tbody>${body}</tbody></table>`;
  $$("[data-edit]").forEach(b=>b.addEventListener("click",()=>openLead(rows.find(x=>x.id===b.dataset.edit))));
}
$("#btnFiltrar").addEventListener("click",()=>{page=0;loadLeads();});
$("#fSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){page=0;loadLeads();}});
$("#pgPrev").addEventListener("click",()=>{if(page>0){page--;loadLeads();}});
$("#pgNext").addEventListener("click",()=>{page++;loadLeads();});

/* ------- modal de edição + ações ------- */
function openLead(l){
  if(!l) return;
  const seqOpts = SEQUENCES.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join("");
  $("#modalRoot").innerHTML = `
  <div class="overlay" id="ov">
    <div class="modal">
      <h3>Editar lead</h3>
      <label>Nome</label><input id="mNome" value="${esc(l.nome)}">
      <label>E-mail</label><input id="mEmail" value="${esc(l.email)}">
      <label>WhatsApp (E.164)</label><input id="mTel" value="${esc(l.telefone_e164)}">
      <label>Status de aquecimento</label>
      <select id="mStatus">
        <option value="frio"${l.status_aquecimento==="frio"?" selected":""}>Frio</option>
        <option value="morno"${l.status_aquecimento==="morno"?" selected":""}>Morno</option>

    toast("Adicionado à sequência");
  });
}

$("#btnExport").addEventListener("click", async ()=>{

  const head=cols.join(";");
  const lines=(data||[]).map(r=>cols.map(c=>csv(r[c])).join(";"));

  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="leads-ana-"+new Date().toISOString().slice(0,10)+".csv";a.click();
  toast(`Exportados ${fmt((data||[]).length)} leads`);
});
function csv(v){if(v==null)return"";const s=String(v).replace(/"/g,'""');return /[;"\n]/.test(s)?`"${s}"`:s;}

async function loadEmail(){
  const { data: ev } = await sb.rpc("crm_email_eventos");
  const map={}; (ev||[]).forEach(e=>map[e.tipo]=Number(e.total));
  $("#emailKpis").innerHTML=[
    kpi("Enviados",fmt((map.sent||0)+(map.delivered||0))),
    kpi("Aberturas",fmt(map.opened||0)),
    kpi("Cliques",fmt(map.clicked||0)),
    kpi("Descadastros",fmt((map.unsubscribed||0)+(map.complained||0))),
  ].join("");
  await carregarSequencias();
}

async function carregarSequencias(){
  const { data } = await sb.from("email_sequences").select("id,nome,objetivo,ativo,from_nome,from_email").order("nome");
  SEQUENCES = data||[];
  if(!SEQUENCES.length){ $("#seqList").innerHTML='<div class="empty">Nenhum funil ainda. Clique em “+ Nova sequência”.</div>'; return; }
  const rows=[];
  for(const s of SEQUENCES){
    const { data: st } = await sb.rpc("crm_funil_stats",{p_sequence:s.id});
    const x = st||{};
    rows.push(`<tr>
      <td><strong>${esc(s.nome)}</strong>${s.objetivo?`<div class="muted" style="font-size:11px">${esc(s.objetivo)}</div>`:""}</td>
      <td>${s.ativo?'<span class="pill ok">ativo</span>':'<span class="pill frio">pausado</span>'}</td>
      <td>${fmt(x.ativos)} ativos · ${fmt(x.concluidos)} concluídos</td>
      <td>${fmt(x.enviados)} env · ${fmt(x.aberturas)} abert · ${fmt(x.cliques)} cliq</td>
      <td><button class="lnk" data-seq="${s.id}">Abrir</button> · <button class="lnk" data-delseq="${s.id}" style="color:#c0392b">Excluir</button></td>
    </tr>`);
  }
  $("#seqList").innerHTML=`<table><thead><tr><th>Funil</th><th>Status</th><th>No funil</th><th>Desempenho</th><th></th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
  $$("[data-seq]").forEach(b=>b.addEventListener("click",()=>abrirSequencia(SEQUENCES.find(s=>s.id===b.dataset.seq))));
  $$("[data-delseq]").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Excluir este funil e todos os seus passos? (os leads saem do funil)"))return;
    await sb.from("email_sequences").delete().eq("id",b.dataset.delseq);
    toast("Funil excluído");carregarSequencias();
  }));
}

    <label>Remetente — e-mail (domínio verificado no Resend)</label><input id="sFromE" value="${esc(s.from_email)}" placeholder="contato@seudominio.com.br">

function cvInfo(n){
  const t=n.tipo||"email", h=Number(n.atraso_horas||0), cfg=n.config||{};
  if(t==="email")   return {ic:"📧",sub:"E-mail"+(h?` · +${h}h`:""),tit:esc(n.assunto)||"(sem assunto)"};
  if(t==="espera")  return {ic:"⏱️",sub:"Espera",tit:`Esperar ${h}h`};
  if(t==="tag_add") return {ic:"🏷️",sub:"Tag"+(h?` · +${h}h`:""),tit:"Add: "+esc(cfg.tag||"—")};
  if(t==="tag_remove")return {ic:"🏷️",sub:"Tag",tit:"Remover: "+esc(cfg.tag||"—")};
  if(t==="condicao") return {ic:"❓",sub:"Condição",tit:(cfg.cond==="clicou"?"Clicou?":"Abriu?")};
  return {ic:"⚙️",sub:t,tit:esc(t)};
}

async function abrirSequencia(s){
  if(!s)return;
  let [{data:steps},{data:origens}]=await Promise.all([
    sb.from("email_steps").select("*").eq("sequence_id",s.id),
    sb.from("origens").select("id,nome,auto_sequence_id").order("nome")
  ]);
  let nodes=steps||[];
  const origOpts=(origens||[]).map(o=>`<option value="${o.id}" ${o.auto_sequence_id===s.id?"selected":""}>${esc(o.nome)}</option>`).join("");
  $("#modalRoot").innerHTML=CV_CSS+`
  <div class="cvwrap" id="cvwrap">
    <div class="cvbar">
      <strong>${esc(s.nome)}</strong>
      <span class="cvhint">Arraste pelo topo · ligue puxando a bolinha de baixo · clique no corpo p/ editar</span>
      <button class="cvbtn" data-new="email">＋ 📧 E-mail</button>
      <button class="cvbtn" data-new="espera">＋ ⏱️ Espera</button>
      <button class="cvbtn" data-new="tag_add">＋ 🏷️ Add tag</button>
      <button class="cvbtn" data-new="tag_remove">＋ 🏷️ Rem tag</button>
      <button class="cvbtn" data-new="condicao">＋ ❓ Condição</button>
      <select class="cvsel" id="autoOrig"><option value="">auto-inscrição: nenhuma</option>${origOpts}</select>
      <button class="cvbtn close" id="cvClose">Fechar ✕</button>
    </div>
    <div class="cvview" id="cvview">
      <div class="cvpan" id="cvpan">
        <svg class="cvedges" id="cvedges" width="6000" height="4000"></svg>
        <div class="cvstart" id="cvstart">▶ Início do funil<div class="chandle" data-start-handle title="Ligar ao 1º balão" style="left:50%"></div></div>
        ${nodes.length?"":'<div class="cvempty">Fluxo vazio. Clique em “＋ E-mail” lá em cima — o balão aparece aqui. Ligue o “Início” ao primeiro balão puxando a bolinha verde de baixo.</div>'}
      </div>
    </div>
  </div>`;

  const pan={x:0,y:0};
  const view=$("#cvview"), panEl=$("#cvpan"), svg=$("#cvedges");
  const nodeById=id=>nodes.find(n=>n.id===id);

  function drawNodes(){
    // remove nós antigos (mantém svg e start)
    $$(".cnode",panEl).forEach(el=>el.remove());
    nodes.forEach(n=>{
      const info=cvInfo(n);
      const el=document.createElement("div");
      el.className="cnode "+(n.tipo||"email")+(n.is_start?" start":"");
      el.style.left=(n.x||120)+"px"; el.style.top=(n.y||120)+"px";
      el.dataset.id=n.id;
      el.innerHTML=`<div class="cnh" data-drag>
          <span>${info.ic}</span><span class="lbl">${info.sub}</span>
          <button class="st ${n.is_start?"on":""}" data-star title="Marcar como início">★</button>
          <button data-x title="Excluir">✕</button>
        </div>
        <div class="cnb" data-edit>${info.tit}</div>`
        + ((n.tipo==="condicao")
          ? `<div class="chandle sim" data-handle data-branch="sim" title="caminho Sim"></div><div class="chtag sim">SIM</div>
             <div class="chandle nao" data-handle data-branch="nao" title="caminho Não"></div><div class="chtag nao">NÃO</div>`
          : `<div class="chandle" data-handle data-branch="sim" title="Ligar ao próximo"></div>`);
      panEl.appendChild(el);
    });
    bindNodes(); drawEdges();
  }
  function center(el){return {x:el.offsetLeft+el.offsetWidth/2, y:el.offsetTop};}
  function bottomAt(el,frac){return {x:el.offsetLeft+el.offsetWidth*frac, y:el.offsetTop+el.offsetHeight};}
  const el4=id=>panEl.querySelector(`.cnode[data-id="${id}"]`);
  function drawEdges(temp){
    let paths="";
    nodes.forEach(n=>{
      const a=el4(n.id); if(!a)return;
      const cond=(n.tipo==="condicao");
      if(n.next_step_id){ const b=el4(n.next_step_id);
        if(b) paths+=edgePath(bottomAt(a,cond?0.32:0.5),center(b),"#128C7E"); }
      if(cond && n.next_no_id){ const b=el4(n.next_no_id);
        if(b) paths+=edgePath(bottomAt(a,0.68),center(b),"#e0574c"); }
    });
    // ligação do Início até o nó marcado como início
    const st=nodes.find(n=>n.is_start), si=$("#cvstart");
    if(st&&si){ const b=el4(st.id);
      if(b) paths+=edgePath({x:si.offsetLeft+si.offsetWidth/2,y:si.offsetTop+si.offsetHeight},center(b),"#128C7E"); }
    if(temp) paths+=edgePath(temp.from,temp.to,"#9aa6ad");
    svg.innerHTML=paths;
  }
  function edgePath(p1,p2,color){
    const dy=Math.max(30,Math.abs(p2.y-p1.y)/2);
    const d=`M ${p1.x} ${p1.y} C ${p1.x} ${p1.y+dy}, ${p2.x} ${p2.y-dy}, ${p2.x} ${p2.y}`;
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5"/>`+
           `<circle cx="${p2.x}" cy="${p2.y}" r="3.5" fill="${color}"/>`;
  }

  function bindNodes(){
    $$(".cnode",panEl).forEach(el=>{
      const id=el.dataset.id;
      el.querySelector("[data-edit]").onclick=(e)=>{e.stopPropagation();editarNo(s,nodeById(id),null,nodes.length,abrirSequencia);};
      el.querySelector("[data-x]").onclick=async(e)=>{e.stopPropagation();
        if(!confirm("Excluir este balão?"))return;
        await sb.from("email_steps").update({next_step_id:null}).eq("next_step_id",id); // limpa quem apontava (Sim)
        await sb.from("email_steps").update({next_no_id:null}).eq("next_no_id",id);     // e o Não
        await sb.from("email_steps").delete().eq("id",id); toast("Excluído"); abrirSequencia(s);};
      el.querySelector("[data-star]").onclick=async(e)=>{e.stopPropagation();
        await sb.from("email_steps").update({is_start:false}).eq("sequence_id",s.id);
        await sb.from("email_steps").update({is_start:true}).eq("id",id); toast("Início definido"); abrirSequencia(s);};
      // arrastar nó pelo header
      el.querySelector("[data-drag]").onmousedown=(e)=>{
        if(e.target.closest("button"))return;
        e.preventDefault(); e.stopPropagation();
        const n=nodeById(id); const sx=e.clientX, sy=e.clientY, ox=n.x||120, oy=n.y||120;
        const mv=(ev)=>{ n.x=ox+(ev.clientX-sx); n.y=oy+(ev.clientY-sy);
          el.style.left=n.x+"px"; el.style.top=n.y+"px"; drawEdges(); };
        const up=async()=>{ document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up);
          await sb.from("email_steps").update({x:Math.round(n.x),y:Math.round(n.y)}).eq("id",id); };
        document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
      };
      // ligar: puxar de cada bolinha (Sim = next_step_id, Não = next_no_id)
      el.querySelectorAll("[data-handle]").forEach(h=>{
        h.onmousedown=(e)=>{
          e.preventDefault(); e.stopPropagation();
          const branch=h.dataset.branch;
          const col=branch==="nao"?"next_no_id":"next_step_id";
          const frac=(nodeById(id).tipo==="condicao")?(branch==="nao"?0.68:0.32):0.5;
          const from=bottomAt(el,frac);
          const mv=(ev)=>{ const r=panEl.getBoundingClientRect();
            drawEdges({from,to:{x:ev.clientX-r.left,y:ev.clientY-r.top}}); };
          const up=async(ev)=>{ document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up);
            const tgt=document.elementFromPoint(ev.clientX,ev.clientY);
            const tn=tgt&&tgt.closest(".cnode");
            if(tn&&tn.dataset.id!==id){ nodeById(id)[col]=tn.dataset.id;
              await sb.from("email_steps").update({[col]:tn.dataset.id}).eq("id",id); toast("Ligado"); }
            drawEdges(); };
          document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
        };
      });
    });
  }

  // pan do fundo
  view.onmousedown=(e)=>{
    if(e.target.closest(".cnode"))return;
    view.classList.add("panning");
    const sx=e.clientX, sy=e.clientY, ox=pan.x, oy=pan.y;
    const mv=(ev)=>{ pan.x=ox+(ev.clientX-sx); pan.y=oy+(ev.clientY-sy);
      panEl.style.transform=`translate(${pan.x}px,${pan.y}px)`; };
    const up=()=>{ view.classList.remove("panning"); document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up); };
    document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
  };

  $("#cvClose").onclick=()=>$("#modalRoot").innerHTML="";

  // ligar o "Início" ao 1º balão (marca is_start no alvo)
  const sh=$("#cvstart").querySelector("[data-start-handle]");
  if(sh) sh.onmousedown=(e)=>{
    e.preventDefault(); e.stopPropagation();
    const si=$("#cvstart"); const from={x:si.offsetLeft+si.offsetWidth/2,y:si.offsetTop+si.offsetHeight};
    const mv=(ev)=>{ const r=panEl.getBoundingClientRect(); drawEdges({from,to:{x:ev.clientX-r.left,y:ev.clientY-r.top}}); };
    const up=async(ev)=>{ document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up);
      const tgt=document.elementFromPoint(ev.clientX,ev.clientY); const tn=tgt&&tgt.closest(".cnode");
      if(tn){ await sb.from("email_steps").update({is_start:false}).eq("sequence_id",s.id);
        await sb.from("email_steps").update({is_start:true}).eq("id",tn.dataset.id); toast("Início ligado"); abrirSequencia(s); }
      else drawEdges(); };
    document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
  };

  // adicionar balão: cai DIRETO no canvas (depois clica pra editar)
  $$("[data-new]").forEach(b=>b.onclick=async()=>{
    const tipo=b.dataset.new;
    const rec={sequence_id:s.id,tipo,ordem:nodes.length+1,
      atraso_horas:tipo==="espera"?24:0, x:140, y:150+nodes.length*95, is_start:nodes.length===0,
      assunto: tipo==="email"?"Novo e-mail":""};   // assunto é obrigatório no banco
    if(tipo==="email"){rec.corpo_html="<p>Olá {{nome}},</p>\n<p>Escreva aqui...</p>";}
    if(tipo==="tag_add"||tipo==="tag_remove"){rec.config={tag:""};}
    if(tipo==="condicao"){rec.config={cond:"abriu"};}
    const {error}=await sb.from("email_steps").insert(rec);
    if(error){toast("Erro ao inserir");return;}
    toast("Balão adicionado — clique nele para editar");abrirSequencia(s);
  });
  $("#autoOrig").onchange=async()=>{
    await sb.from("origens").update({auto_sequence_id:null}).eq("auto_sequence_id",s.id);
    const oid=$("#autoOrig").value;
    if(oid) await sb.from("origens").update({auto_sequence_id:s.id}).eq("id",oid);
    toast("Auto-inscrição salva");
  };

  drawNodes();
}

/* --- editar nó (por tipo) --- */
function editarNo(seq,node,tipoNovo,qtd,onClose,extra){
  node=node||{}; const tipo=node.tipo||tipoNovo||"email";
  const cfg=node.config||{};
  const campos = tipo==="email"
    ? `<label>Assunto <span class="muted">({{nome}} = 1º nome)</span></label><input id="nAssunto" value="${esc(node.assunto)}">
       <label>Corpo (HTML — {{nome}} disponível)</label>
       <textarea id="nCorpo" style="width:100%;min-height:150px;padding:10px;border:1px solid #cfd8dd;border-radius:9px;font-family:monospace;font-size:13px">${esc(node.corpo_html)}</textarea>`
    : (tipo==="tag_add"||tipo==="tag_remove")
    ? `<label>Nome da tag</label><input id="nTag" value="${esc(cfg.tag)}" placeholder="ex: cliente">`
    : tipo==="condicao"
    ? `<label>Condição a avaliar</label><select id="nCond">
         <option value="abriu" ${cfg.cond!=="clicou"?"selected":""}>Abriu o e-mail anterior?</option>
         <option value="clicou" ${cfg.cond==="clicou"?"selected":""}>Clicou no e-mail anterior?</option>
       </select>
       <p class="muted" style="font-size:12px;margin-top:8px">A saída <b>SIM</b> segue se o lead abriu/clicou; a <b>NÃO</b> segue caso contrário. Ligue cada bolinha ao balão de destino.</p>`
    : `<p class="muted" style="font-size:13px">Este balão só aguarda o tempo definido abaixo antes de seguir.</p>`;
  const titulo={email:"E-mail",espera:"Espera",tag_add:"Adicionar tag",tag_remove:"Remover tag",condicao:"Condição"}[tipo]||tipo;
  $("#modalRoot").insertAdjacentHTML("beforeend",`<div class="overlay" id="ov2" style="z-index:90"><div class="modal" style="max-width:560px">
    <h3>${node.id?"Editar":"Novo"} balão · ${titulo}</h3>
    <label>Esperar (horas) antes deste balão</label>
    <input id="nAtraso" type="number" min="0" value="${node.atraso_horas!=null?node.atraso_horas:0}">
    ${campos}
    <div class="actions"><button class="btn" id="nSave">Salvar</button><button class="btn ghost" id="nClose">Cancelar</button></div>
  </div></div>`);
  const wrap=$("#ov2");
  const close=()=>{wrap.remove();};
  $("#nClose").onclick=close; wrap.onclick=e=>{if(e.target.id==="ov2")close();};
  $("#nSave").onclick=async()=>{
    const rec={sequence_id:seq.id,tipo,atraso_horas:Number($("#nAtraso").value)||0};
    if(tipo==="email"){ rec.assunto=$("#nAssunto").value.trim(); rec.corpo_html=$("#nCorpo").value;
      if(!rec.assunto){toast("Dê um assunto");return;} }
    if(tipo==="tag_add"||tipo==="tag_remove"){ const t=$("#nTag").value.trim();
      if(!t){toast("Informe a tag");return;} rec.config={tag:t}; }
    if(tipo==="condicao"){ rec.config={cond:$("#nCond").value}; }
    let err;
    if(node.id){({error:err}=await sb.from("email_steps").update(rec).eq("id",node.id));}
    else { rec.ordem=(qtd||0)+1; if(extra){rec.x=extra.x;rec.y=extra.y;rec.is_start=!!extra.is_start;}
      ({error:err}=await sb.from("email_steps").insert(rec)); }
    if(err){toast("Erro ao salvar");return;}
    toast("Balão salvo");close(); if(onClose)onClose(seq);
  };
}

/* --- inscrever segmento --- */
$("#btnInscrever").addEventListener("click",async()=>{
  if(!SEQUENCES.length){toast("Crie um funil primeiro");return;}
  const { data: origens } = await sb.from("origens").select("id,nome").order("nome");
  const seqOpts=SEQUENCES.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join("");
  const origOpts=(origens||[]).map(o=>`<option value="${o.id}">${esc(o.nome)}</option>`).join("");
  $("#modalRoot").innerHTML=`<div class="overlay" id="ov"><div class="modal">
    <h3>Inscrever segmento num funil</h3>
    <label>Funil</label><select id="iSeq">${seqOpts}</select>
    <label>Estado (opcional)</label><input id="iUf" placeholder="Ex: SP" maxlength="2">
    <label>Origem (opcional)</label><select id="iOrig"><option value="">todas</option>${origOpts}</select>
    <label>Tag (opcional)</label><input id="iTag" placeholder="ex: telefone_revisar">
    <div class="chk"><input type="checkbox" id="iOptin" checked><label style="margin:0">Só com opt-in</label></div>
    <div class="actions"><button class="btn" id="iGo">Inscrever</button><button class="btn ghost" id="iClose">Cancelar</button></div>
    <p class="muted" style="font-size:11px;margin-top:8px">Descadastrados nunca entram. Quem já está no funil é ignorado.</p>
  </div></div>`;
  const close=()=>$("#modalRoot").innerHTML="";
  $("#iClose").onclick=close; $("#ov").onclick=e=>{if(e.target.id==="ov")close();};
  $("#iGo").onclick=async()=>{
    const args={p_sequence:$("#iSeq").value,
      p_uf:($("#iUf").value.trim().toUpperCase()||null),
      p_origem:($("#iOrig").value||null),
      p_tag:($("#iTag").value.trim()||null),
      p_somente_optin:$("#iOptin").checked};
    const { data, error } = await sb.rpc("enroll_segment",args);
    if(error){toast("Erro ao inscrever");return;}
    toast(`${fmt(data)} leads inscritos`);close();carregarSequencias();
  };
});

/* ================= GRUPOS E REDES ================= */
async function loadCanais(){
  const { data: g } = await sb.from("groups").select("nome,qtd_membros,ativo").order("qtd_membros",{ascending:false});
  if(g && g.length){
    $("#gruposWrap").innerHTML=`<table><thead><tr><th>Grupo</th><th>Membros</th><th>Status</th></tr></thead><tbody>${
      g.map(x=>`<tr><td>${esc(x.nome)}</td><td>${fmt(x.qtd_membros)}</td><td>${x.ativo?'<span class="pill ok">ativo</span>':'<span class="muted">inativo</span>'}</td></tr>`).join("")
    }</tbody></table>`;
  } else $("#gruposWrap").innerHTML='<div class="empty">Nenhum grupo ainda. Aparecem quando o webhook do SendFlow for ligado.</div>';

  const { data: s } = await sb.from("social_accounts").select("id,plataforma,handle").eq("ativo",true);
  if(!s || !s.length){ $("#socialWrap").innerHTML='<div class="empty">Nenhuma conta social conectada ainda.</div>'; return; }
  const cards=[];
  for(const acc of s){
    const { data: m } = await sb.from("social_metrics").select("seguidores,visualizacoes,coletado_em").eq("account_id",acc.id).order("coletado_em",{ascending:false}).limit(1);
    const last=m&&m[0]?m[0]:{};
    cards.push(kpi(`${acc.plataforma} ${acc.handle?"· "+acc.handle:""}`, fmt(last.seguidores||0), last.coletado_em?("atualizado "+new Date(last.coletado_em).toLocaleDateString("pt-BR")):"sem coleta"));
  }
  $("#socialWrap").innerHTML=`<div class="cards">${cards.join("")}</div>`;
}

/* ================= CHART HELPERS ================= */
function destroy(id){ if(CHARTS[id]){CHARTS[id].destroy();delete CHARTS[id];} }
function lineChart(id,labels,data,label){
  destroy(id);
  CHARTS[id]=new Chart($("#"+id),{type:"line",data:{labels,datasets:[{label,data,borderColor:"#128C7E",backgroundColor:"#128C7E22",fill:true,tension:.3,pointRadius:2}]},options:baseOpts()});
}
function barChart(id,labels,data,label){
  destroy(id);
  CHARTS[id]=new Chart($("#"+id),{type:"bar",data:{labels,datasets:[{label,data,backgroundColor:"#128C7E"}]},options:baseOpts()});
}
function doughnut(id,labels,data,colors){
  destroy(id);
  CHARTS[id]=new Chart($("#"+id),{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:"bottom"}}}});
}
function baseOpts(){return{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}};}

/* ---------- start ---------- */
async function init(){
  // Tenta a config do Pages (variáveis) primeiro; cai no fallback do arquivo.
  try{
    const r = await fetch("/api/config", { cache: "no-store" });
    const c = await r.json();
    if (c && c.ok && c.url && c.anonKey){ SUPABASE_URL = c.url; SUPABASE_ANON_KEY = c.anonKey; }
  }catch(e){ console.warn("[config] /api/config indisponível, usando fallback do arquivo.", e); }

  if (!configOk()){
    $("#loginErr").textContent = "⚠️ Configuração ausente: adicione a variável SUPABASE_ANON_KEY nas variáveis do Pages (ou preencha no topo do painel.html).";
    console.error("[config] SUPABASE_ANON_KEY não encontrada.");
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  guard();
}
init();
</script>
